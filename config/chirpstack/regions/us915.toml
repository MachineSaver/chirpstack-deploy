[[regions]]

  # US915 — Sub-band 2 (channels 8-15 + 65), the most common for US deployments.
  # Compatible with TTN, Helium, and most US gateway defaults.
  id="us915"
  description="US915"

  [regions.network]
    installation_margin=10
    rx_window=0
    rx1_delay=1
    rx1_dr_offset=0
    rx2_dr=8
    rx2_frequency=923300000
    rx2_preferred_on_rx1_dr_lt=0
    rx2_preferred_on_rx1_dr_gt=0
    gateway_prefer_min_margin=10
    downlink_tx_power=-1
    adr_disabled=false
    min_dr=0
    max_dr=3
    uplink_dwell_time_400ms=false
    downlink_dwell_time_400ms=false
    uplink_max_eirp=-1
    rejoin_request_enabled=false
    rejoin_request_max_count_n=0
    rejoin_request_max_time_n=0

    [regions.network.band]
      name="US915"

    [[regions.network.extra_channels]]

    [regions.network.class_b]
      ping_slot_dr=8
      ping_slot_frequency=923300000

    [regions.network.rejoin_request]
      enabled=false
      max_count_n=0
      max_time_n=0

    # Sub-band 2 mask: only channels 8-15 (indices 1 in the 8-group bitmask)
    # This restricts to the standard 8-channel sub-band used by most US gateways
    [[regions.network.enabled_uplink_channels]]
      # Channels 8–15 (sub-band 2) + 65
      channels=[8, 9, 10, 11, 12, 13, 14, 15]
