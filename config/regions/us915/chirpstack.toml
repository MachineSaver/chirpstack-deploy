[[regions]]

  # US915 - Sub-band 1 (channels 0-7 + 64) for the current Cloudgate Basic Station test plan.
  # Aligned with the live Basics Station concentrator frequencies.
  id="us915"
  description="US915"
  common_name="US915"

  [regions.network]
    installation_margin=10
    rx_window=0
    rx1_delay=1
    rx1_dr_offset=0
    rx2_dr=8
    rx2_frequency=923300000
    rx2_preferred_on_rx1_dr_lt=0
    rx2_preferred_on_rx1_dr_gt=0
    gateway_prefer_min_margin=10
    downlink_tx_power=-1
    adr_disabled=false
    min_dr=0
    max_dr=3
    uplink_dwell_time_400ms=false
    downlink_dwell_time_400ms=false
    uplink_max_eirp=-1
    rejoin_request_enabled=false
    rejoin_request_max_count_n=0
    rejoin_request_max_time_n=0

    [regions.network.band]
      name="US915"

    [regions.network.class_b]
      ping_slot_dr=8
      ping_slot_frequency=923300000

    [regions.network.rejoin_request]
      enabled=false
      max_count_n=0
      max_time_n=0

    # Sub-band 1: channels 0-7 match the current live Basic Station router config
    enabled_uplink_channels=[0, 1, 2, 3, 4, 5, 6, 7]
