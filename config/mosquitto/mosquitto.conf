# Mosquitto MQTT Broker Configuration
# MQTT v5 with shared subscriptions (required by ChirpStack v4)

per_listener_settings false

# Plain MQTT listener (internal Docker network only in production;
# also exposed on host MQTT_PORT for external clients)
listener 1883
protocol mqtt

# Require authentication for all connections
allow_anonymous false
password_file /mosquitto/config/passwd

# MQTT v5 shared subscription support
# (enabled by default in Mosquitto 2.x — no extra flag needed)

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
