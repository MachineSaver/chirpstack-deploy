name: chirpstack

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15.17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - chirpstack-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4.8-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 900 1 --save 300 10
    volumes:
      - redis_data:/data
    networks:
      - chirpstack-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Mosquitto MQTT Broker ───────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    volumes:
      - ./config/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./generated/mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
    networks:
      - chirpstack-net

  # ── ChirpStack Server ───────────────────────────────────────────────────────
  chirpstack:
    image: chirpstack/chirpstack:4.17.0
    restart: unless-stopped
    command: -c /etc/chirpstack
    environment:
      MQTT_BROKER_URI: "tcp://${MOSQUITTO_USER}:${MOSQUITTO_PASSWORD}@mosquitto:1883"
    volumes:
      - ./generated/chirpstack/chirpstack.toml:/etc/chirpstack/chirpstack.toml:ro
      - ./generated/chirpstack/region.toml:/etc/chirpstack/region.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    networks:
      - chirpstack-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8070/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ── ChirpStack Gateway Bridge — Semtech UDP Packet Forwarder ────────────────
  gateway-bridge-udp:
    image: chirpstack/chirpstack-gateway-bridge:4.1.1
    restart: unless-stopped
    ports:
      - "${GATEWAY_UDP_PORT:-1700}:1700/udp"
    environment:
      INTEGRATION__MQTT__AUTH__GENERIC__SERVER: "tcp://${MOSQUITTO_USER}:${MOSQUITTO_PASSWORD}@mosquitto:1883"
      INTEGRATION__MQTT__AUTH__GENERIC__USERNAME: "${MOSQUITTO_USER}"
      INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD: "${MOSQUITTO_PASSWORD}"
    volumes:
      - ./config/gateway-bridge/udp.toml:/etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml:ro
    depends_on:
      - mosquitto
    networks:
      - chirpstack-net

  # ── ChirpStack Gateway Bridge — Basics Station (WebSocket) ─────────────────
  gateway-bridge-bs:
    image: chirpstack/chirpstack-gateway-bridge:4.1.1
    restart: unless-stopped
    environment:
      INTEGRATION__MQTT__AUTH__GENERIC__SERVER: "tcp://${MOSQUITTO_USER}:${MOSQUITTO_PASSWORD}@mosquitto:1883"
      INTEGRATION__MQTT__AUTH__GENERIC__USERNAME: "${MOSQUITTO_USER}"
      INTEGRATION__MQTT__AUTH__GENERIC__PASSWORD: "${MOSQUITTO_PASSWORD}"
    volumes:
      - ./generated/gateway-bridge/bs.toml:/etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge.toml:ro
    depends_on:
      - mosquitto
    networks:
      - chirpstack-net

  # ── Nginx Reverse Proxy ─────────────────────────────────────────────────────
  nginx:
    image: nginx:1.29.8-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${GATEWAY_BS_PORT:-3001}:3001"
    volumes:
      - ./generated/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      chirpstack:
        condition: service_healthy
    networks:
      - chirpstack-net

volumes:
  postgres_data:
  redis_data:
  mosquitto_data:
  certbot_www:
  certbot_certs:

networks:
  chirpstack-net:
    driver: bridge
